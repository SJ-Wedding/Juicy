<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자료실 - JUICY 파트너 게시판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div id="gnb"></div>

  <main class="page-main">
    <div class="page-header">
      <div>
        <h1 class="page-title">자료실</h1>
        <p class="page-subtitle">위생 체크리스트, POS 매뉴얼, 발주 서식 등 문서를 내려받으세요</p>
      </div>
      <button id="writeBtn" class="btn-primary hidden">+ 자료 등록</button>
    </div>

    <div id="writeForm" class="form-card hidden">
      <div class="form-row">
        <div class="form-field" style="flex:2;">
          <label>자료 제목</label>
          <input id="f_title" type="text" placeholder="예: 위생 점검 체크리스트">
        </div>
        <div class="form-field">
          <label>분류</label>
          <select id="f_category">
            <option value="매뉴얼">매뉴얼</option>
            <option value="서식">서식</option>
            <option value="포스터">포스터</option>
            <option value="기타">기타</option>
          </select>
        </div>
      </div>
      <div class="form-field">
        <label>파일 링크 (구글 드라이브, Supabase Storage 등)</label>
        <input id="f_url" type="url" placeholder="https://...">
      </div>
      <div id="formError" class="error-text hidden"></div>
      <div style="display:flex; gap:10px;">
        <button id="submitBtn" class="btn-primary">등록</button>
        <button id="cancelBtn" class="btn-link">취소</button>
      </div>
    </div>

    <div id="resourceList" style="display:flex; flex-direction:column;"><div class="empty-state">불러오는 중...</div></div>
  </main>

  <script src="assets/supabaseClient.js"></script>
  <script src="assets/app.js"></script>
  <script>
    let profileRef = null;

    async function loadResources() {
      const { data, error } = await sb.from("resources").select("*").order("created_at", { ascending: false });
      const listEl = document.getElementById("resourceList");
      if (error) {
        listEl.innerHTML = `<div class="empty-state">불러오기 실패: ${escapeHtml(error.message)}</div>`;
        return;
      }
      if (!data || data.length === 0) {
        listEl.innerHTML = '<div class="empty-state">등록된 자료가 없습니다</div>';
        return;
      }
      listEl.innerHTML = data.map((r) => `
        <a href="${escapeHtml(r.url)}" target="_blank" rel="noopener" class="card resource-item" style="display:flex; align-items:center; gap:14px;">
          <span class="pill pill-neutral">${escapeHtml(r.category)}</span>
          <span style="font-size:15px; font-weight:600; flex-grow:1;">${escapeHtml(r.title)}</span>
          <span style="font-size:13px; color:var(--muted);">${formatDate(r.created_at)}</span>
          <span style="font-size:13px; color:var(--accent-dark);">열기 ›</span>
        </a>
      `).join("");
    }

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      profileRef = auth.profile;
      renderGnb("resources", profileRef);
      revealPage();

      if (isVisor(profileRef)) {
        document.getElementById("writeBtn").classList.remove("hidden");
      }

      document.getElementById("writeBtn").addEventListener("click", () => {
        document.getElementById("writeForm").classList.remove("hidden");
        document.getElementById("writeBtn").classList.add("hidden");
      });
      document.getElementById("cancelBtn").addEventListener("click", () => {
        document.getElementById("writeForm").classList.add("hidden");
        document.getElementById("writeBtn").classList.remove("hidden");
      });

      document.getElementById("submitBtn").addEventListener("click", async () => {
        const errEl = document.getElementById("formError");
        clearFormError(errEl);
        const title = document.getElementById("f_title").value.trim();
        const category = document.getElementById("f_category").value;
        const url = document.getElementById("f_url").value.trim();
        if (!title || !url) {
          showFormError(errEl, "제목과 링크를 모두 입력해주세요.");
          return;
        }
        const { error } = await sb.from("resources").insert({ title, category, url, author_id: profileRef.id });
        if (error) {
          showFormError(errEl, "등록에 실패했습니다: " + error.message);
          return;
        }
        document.getElementById("f_title").value = "";
        document.getElementById("f_url").value = "";
        document.getElementById("writeForm").classList.add("hidden");
        document.getElementById("writeBtn").classList.remove("hidden");
        loadResources();
      });

      loadResources();
    })();
  </script>
</body>
</html>
