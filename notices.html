<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공지사항 - JUICY 파트너 게시판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div id="gnb"></div>

  <main class="page-main">
    <div class="page-header">
      <div>
        <h1 class="page-title">공지사항</h1>
        <p class="page-subtitle">회사 소식, 정책 변경, 프로모션 안내를 확인하세요</p>
      </div>
      <button id="writeBtn" class="btn-primary hidden">+ 공지 작성</button>
    </div>

    <div id="writeForm" class="form-card hidden">
      <div class="form-row">
        <div class="form-field" style="flex:2;">
          <label>제목</label>
          <input id="f_title" type="text" placeholder="공지 제목을 입력하세요">
        </div>
        <div class="form-field">
          <label>분류</label>
          <select id="f_category">
            <option value="일반">일반</option>
            <option value="정책">정책</option>
            <option value="프로모션">프로모션</option>
            <option value="휴무/일정">휴무/일정</option>
          </select>
        </div>
      </div>
      <div class="form-field">
        <label>내용</label>
        <textarea id="f_content" placeholder="공지 내용을 입력하세요"></textarea>
      </div>
      <label class="checkbox-row"><input type="checkbox" id="f_pinned"> 필독 공지로 상단에 고정</label>
      <div id="formError" class="error-text hidden"></div>
      <div style="display:flex; gap:10px;">
        <button id="submitBtn" class="btn-primary">등록</button>
        <button id="cancelBtn" class="btn-link">취소</button>
      </div>
    </div>

    <div id="noticeList" style="display:flex; flex-direction:column;"><div class="empty-state">불러오는 중...</div></div>
  </main>

  <script src="assets/supabaseClient.js"></script>
  <script src="assets/app.js"></script>
  <script>
    let profileRef = null;

    async function loadNotices() {
      const { data, error } = await sb.from("notices").select("*").order("is_pinned", { ascending: false }).order("created_at", { ascending: false });
      const listEl = document.getElementById("noticeList");
      if (error) {
        listEl.innerHTML = `<div class="empty-state">공지사항을 불러오지 못했습니다: ${escapeHtml(error.message)}</div>`;
        return;
      }
      if (!data || data.length === 0) {
        listEl.innerHTML = '<div class="empty-state">등록된 공지사항이 없습니다</div>';
        return;
      }
      listEl.innerHTML = data.map((n) => `
        <div class="card notice-item">
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            ${n.is_pinned ? '<span class="pill pill-amber-solid">필독</span>' : isWithinDays(n.created_at, 7) ? '<span class="pill pill-secondary">NEW</span>' : ""}
            <span style="font-size:16px; font-weight:700; flex-grow:1;">${escapeHtml(n.title)}</span>
            <span style="font-size:13px; color:var(--muted);">${escapeHtml(n.category)} · ${formatDate(n.created_at)}</span>
          </div>
          <div style="margin-top:10px; font-size:14px; color:var(--ink-soft); line-height:1.6; white-space:pre-line;">${escapeHtml(n.content)}</div>
        </div>
      `).join("");
    }

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      profileRef = auth.profile;
      renderGnb("notices", profileRef);
      revealPage();

      if (isVisor(profileRef)) {
        document.getElementById("writeBtn").classList.remove("hidden");
      }

      document.getElementById("writeBtn").addEventListener("click", () => {
        document.getElementById("writeForm").classList.remove("hidden");
        document.getElementById("writeBtn").classList.add("hidden");
      });
      document.getElementById("cancelBtn").addEventListener("click", () => {
        document.getElementById("writeForm").classList.add("hidden");
        document.getElementById("writeBtn").classList.remove("hidden");
      });

      document.getElementById("submitBtn").addEventListener("click", async () => {
        const errEl = document.getElementById("formError");
        clearFormError(errEl);
        const title = document.getElementById("f_title").value.trim();
        const content = document.getElementById("f_content").value.trim();
        const category = document.getElementById("f_category").value;
        const isPinned = document.getElementById("f_pinned").checked;

        if (!title || !content) {
          showFormError(errEl, "제목과 내용을 모두 입력해주세요.");
          return;
        }

        const { error } = await sb.from("notices").insert({
          title, content, category, is_pinned: isPinned, author_id: profileRef.id,
        });

        if (error) {
          showFormError(errEl, "등록에 실패했습니다: " + error.message);
          return;
        }

        document.getElementById("f_title").value = "";
        document.getElementById("f_content").value = "";
        document.getElementById("f_pinned").checked = false;
        document.getElementById("writeForm").classList.add("hidden");
        document.getElementById("writeBtn").classList.remove("hidden");
        loadNotices();
      });

      loadNotices();
    })();
  </script>
</body>
</html>
