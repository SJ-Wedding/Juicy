<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUICY 파트너 게시판 - 로그인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div style="text-align:center; display:flex; flex-direction:column; gap:4px;">
        <span class="brand-logo" style="font-size:30px;">JUICY</span>
        <span style="font-size:13.5px; color:var(--muted);">점주 파트너 게시판</span>
      </div>

      <form id="loginForm" style="display:flex; flex-direction:column; gap:14px;">
        <div class="form-field">
          <label for="email">이메일</label>
          <input id="email" type="email" required placeholder="store01@juicy.com">
        </div>
        <div class="form-field">
          <label for="password">비밀번호</label>
          <input id="password" type="password" required placeholder="비밀번호를 입력하세요">
        </div>
        <div id="errorMsg" class="error-text hidden"></div>
        <button type="submit" id="submitBtn" class="btn-primary" style="width:100%;">로그인</button>
      </form>

      <div style="font-size:12.5px; color:var(--muted); text-align:center; line-height:1.6;">
        계정이 없으신가요? 바이저(운영 담당자)에게 문의해 계정을 발급받으세요.
      </div>
    </div>
  </div>

  <script src="assets/supabaseClient.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");
    const submitBtn = document.getElementById("submitBtn");

    // 이미 로그인되어 있으면 화면을 보여주지 않고 바로 홈으로 이동, 아니면 로그인 폼을 보여줍니다.
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        location.replace("index.html");
        return;
      }
      revealPage();
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "로그인 중...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await sb.auth.signInWithPassword({ email, password });

      submitBtn.disabled = false;
      submitBtn.textContent = "로그인";

      if (error) {
        errorMsg.textContent = "이메일 또는 비밀번호가 올바르지 않습니다.";
        errorMsg.classList.remove("hidden");
        return;
      }
      location.href = "index.html";
    });
  </script>
</body>
</html>
