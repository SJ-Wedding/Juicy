<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>본사 발주 - GOMANGO 파트너 게시판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div id="gnb"></div>

  <main class="page-main">
    <div class="page-header">
      <div>
        <h1 class="page-title">본사 발주</h1>
        <p class="page-subtitle">매장에 필요한 물품을 요청하면 담당자가 발주 확인 후 댓글로 안내드립니다</p>
      </div>
      <div style="display:flex; gap:10px;">
        <button id="priceSettingBtn" class="btn-outline hidden">발주 금액 설정</button>
        <button id="writeBtn" class="btn-primary">+ 발주 요청하기</button>
      </div>
    </div>

    <div class="bank-notice-box">※ 고망고 입금 계좌 : <strong>신한은행 100-037-181930</strong>
※ 출고 및 발주처리 - 12시 이전 입금 확인 주문건</div>

    <div id="writeForm" class="form-card hidden">
      <div class="form-row">
        <div class="form-field" style="flex:2;">
          <label>필요한 물품</label>
          <select id="f_item"></select>
        </div>
        <div class="form-field" id="qtyFieldWrap">
          <label id="qtyLabel">수량/단위</label>
          <select id="f_qty"></select>
        </div>
      </div>
      <div id="qtyNote" class="order-note hidden"></div>
      <div class="form-field">
        <label>요청 사항 (선택)</label>
        <textarea id="f_note" placeholder="희망 배송일, 참고사항 등"></textarea>
      </div>
      <div class="order-total" id="estimatedTotal"></div>
      <div id="formError" class="error-text hidden"></div>
      <div style="display:flex; gap:10px;">
        <button id="submitBtn" class="btn-primary">등록</button>
        <button id="cancelBtn" class="btn-link">취소</button>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:8px;" id="statusTabs"></div>

    <div id="orderList" style="display:flex; flex-direction:column;"><div class="empty-state">불러오는 중...</div></div>
  </main>

  <!-- 바이저 전용: 발주 금액 설정 모달 -->
  <div id="priceModalBackdrop" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span style="font-size:17px; font-weight:700;">본사 발주 금액 설정</span>
        <button id="priceModalCloseBtn" class="btn-link">닫기</button>
      </div>
      <p style="font-size:12.5px; color:var(--muted); margin:0;">품목별 단가(원)를 입력하세요. 총 금액은 "단가 × 선택한 수량/단위 숫자"로 계산됩니다 (사이즈처럼 숫자가 아닌 옵션은 1개로 계산돼요).</p>
      <div id="priceRows"></div>
      <div id="priceModalError" class="error-text hidden"></div>
      <button id="priceSaveBtn" class="btn-primary">저장</button>
    </div>
  </div>

  <script src="assets/supabaseClient.js"></script>
  <script src="assets/app.js"></script>
  <script>
    // 발주 가능 품목 목록 (필요하면 이 배열만 수정하면 됩니다)
    const ORDER_CATALOG = [
      { name: "배망 (2000EA/BOX)", unitLabel: "수량", options: ["1박스", "2박스", "3박스", "4박스", "5박스"] },
      { name: "반팔티셔츠", unitLabel: "Size(사이즈)", options: ["95", "100", "105"] },
      { name: "앞치마 (검정/FREE)", unitLabel: "수량", options: ["1개", "2개", "3개", "4개", "5개", "6개", "7개", "8개", "9개", "10개"] },
      { name: "스냅백 (노랑/FREE)", unitLabel: "수량", options: ["1개", "2개", "3개", "4개", "5개", "6개", "7개", "8개", "9개", "10개"] },
      { name: "맨투맨", unitLabel: "Size(사이즈)", options: ["95", "100", "105"] },
      { name: "무지 1구 비닐캐리어 (200EA/PK)", unitLabel: "수량/단위", options: ["1팩", "2팩", "3팩", "4팩", "5팩"], note: "★ 고망고 무지 1구, 2구 비닐캐리어는 합산 4PK부터 주문 가능 ★" },
      { name: "무지 2구 비닐캐리어 (200EA/PK)", unitLabel: "수량/단위", options: ["1팩", "2팩", "3팩", "4팩", "5팩"], note: "★ 고망고 무지 1구, 2구 비닐캐리어는 합산 4PK부터 주문 가능 ★" },
    ];
    function catalogItem(name) {
      return ORDER_CATALOG.find((c) => c.name === name) || ORDER_CATALOG[0];
    }

    let profileRef = null;
    let allOrders = [];
    let currentStatus = "전체";
    let editingId = null;
    let priceMap = {}; // { 품목명: 단가 }

    // ---------- 작성 폼: 물품 선택에 따라 수량/단위 드롭박스 갱신 ----------
    function populateItemSelect() {
      const sel = document.getElementById("f_item");
      sel.innerHTML = ORDER_CATALOG.map((c) => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join("");
    }

    function refreshQtyField() {
      const itemName = document.getElementById("f_item").value;
      const item = catalogItem(itemName);
      document.getElementById("qtyLabel").textContent = item.unitLabel;
      document.getElementById("f_qty").innerHTML = item.options.map((o) => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("");
      const noteEl = document.getElementById("qtyNote");
      if (item.note) {
        noteEl.textContent = item.note;
        noteEl.classList.remove("hidden");
      } else {
        noteEl.classList.add("hidden");
      }
      refreshEstimatedTotal();
    }

    function refreshEstimatedTotal() {
      const itemName = document.getElementById("f_item").value;
      const qty = document.getElementById("f_qty").value;
      const unitPrice = priceMap[itemName] || 0;
      const multiplier = parseOrderQtyMultiplier(qty);
      document.getElementById("estimatedTotal").textContent = `예상 금액: ${formatWon(unitPrice * multiplier)} (단가 ${formatWon(unitPrice)} × ${multiplier})`;
    }

    // ---------- 발주 금액 설정 (바이저) ----------
    async function loadPriceMap() {
      const { data } = await sb.from("order_item_prices").select("*");
      priceMap = {};
      (data || []).forEach((row) => { priceMap[row.item_name] = row.unit_price; });
    }

    function openPriceModal() {
      document.getElementById("priceRows").innerHTML = ORDER_CATALOG.map((c) => `
        <div class="price-row">
          <span style="font-size:13.5px;">${escapeHtml(c.name)}</span>
          <input type="number" min="0" step="10" class="price-input" data-name="${escapeHtml(c.name)}" value="${priceMap[c.name] || 0}">
        </div>
      `).join("");
      document.getElementById("priceModalBackdrop").classList.remove("hidden");
    }
    function closePriceModal() {
      document.getElementById("priceModalBackdrop").classList.add("hidden");
    }

    // ---------- 발주 리스트 ----------
    function renderStatusTabs() {
      const statuses = ["전체", "요청", "발주완료"];
      document.getElementById("statusTabs").innerHTML = statuses.map((s) => {
        const count = s === "전체" ? allOrders.length : allOrders.filter((x) => x.status === s).length;
        return `<button class="tab-pill ${s === currentStatus ? "active" : ""}" data-status="${s}">${s} ${count}</button>`;
      }).join("");
      document.querySelectorAll("#statusTabs .tab-pill").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentStatus = btn.dataset.status;
          renderStatusTabs();
          renderOrders();
        });
      });
    }

    function startEdit(o) {
      editingId = o.id;
      document.getElementById("f_item").value = o.item_name;
      refreshQtyField();
      document.getElementById("f_qty").value = o.quantity || "";
      document.getElementById("f_note").value = o.note || "";
      refreshEstimatedTotal();
      document.getElementById("submitBtn").textContent = "수정 저장";
      document.getElementById("writeForm").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderOrders() {
      const filtered = currentStatus === "전체" ? allOrders : allOrders.filter((o) => o.status === currentStatus);
      const listEl = document.getElementById("orderList");
      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-state">발주 요청이 없습니다</div>';
        return;
      }
      listEl.innerHTML = filtered.map((o) => {
        const storeLabel = o.profiles ? o.profiles.store_name : "";
        const comments = o.supply_request_comments || [];
        const commentHtml = comments.map((c) => `
          <div style="background:var(--neutral-tint); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:6px; margin-top:10px;">
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="pill pill-accent">본사 확인</span>
              <span style="font-size:12px; color:var(--muted);">${formatDateTime(c.created_at)}</span>
            </div>
            <div style="font-size:13.5px; color:var(--ink); line-height:1.55;">${escapeHtml(c.content)}</div>
          </div>
        `).join("");

        const canComment = isVisor(profileRef) && o.status === "요청";
        const commentFormHtml = canComment ? `
          <div style="margin-top:10px; display:flex; gap:8px;">
            <input type="text" class="comment-input" data-id="${o.id}" placeholder="발주 확인 내용을 입력하세요 (예: 9/20 입고 예정)" style="flex-grow:1; font-family:inherit; font-size:13.5px; padding:9px 12px; border:1px solid var(--border); border-radius:8px;">
            <button class="btn-primary comment-submit" data-id="${o.id}" style="padding:9px 16px;">발주완료 처리</button>
          </div>
        ` : "";

        const canEdit = isVisor(profileRef) || o.owner_id === profileRef.id;
        const canDelete = isVisor(profileRef);
        const actionsHtml = (canEdit || canDelete) ? `
          <div class="row-actions" style="margin-top:10px;">
            ${canEdit ? `<button class="btn-edit" data-id="${o.id}" data-action="edit">수정</button>` : ""}
            ${canDelete ? `<button class="btn-delete" data-id="${o.id}" data-action="delete">삭제</button>` : ""}
          </div>
        ` : "";

        const unitPrice = priceMap[o.item_name] || 0;
        const multiplier = parseOrderQtyMultiplier(o.quantity);
        const totalAmount = unitPrice * multiplier;

        const payState = (o.payment_status === "완료") ? "paid" : "unpaid";
        const payDisabled = isVisor(profileRef) ? "" : "disabled";
        const payToggleHtml = `
          <div class="pay-toggle">
            <button class="pay-btn ${payState === "unpaid" ? "active state-unpaid" : ""}" data-id="${o.id}" data-value="미완료" ${payDisabled}>송금 미완료</button>
            <button class="pay-btn ${payState === "paid" ? "active state-paid" : ""}" data-id="${o.id}" data-value="완료" ${payDisabled}>송금 완료</button>
          </div>
        `;

        return `
          <div class="card suggestion-item">
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <span class="pill ${o.status === "발주완료" ? "pill-green" : "pill-amber"}">${o.status}</span>
              ${payToggleHtml}
              <span style="font-size:15px; font-weight:700; flex-grow:1;">${escapeHtml(o.item_name)}${o.quantity ? ` · ${escapeHtml(o.quantity)}` : ""}</span>
              <span style="font-size:12.5px; color:var(--muted);">${escapeHtml(storeLabel)}</span>
              <span style="font-size:12.5px; color:var(--muted);">${metaDateLabel(o)}</span>
            </div>
            <div class="order-total" style="margin-top:8px;">총 금액: ${formatWon(totalAmount)} <span style="font-weight:400; color:var(--muted); font-size:12.5px;">(단가 ${formatWon(unitPrice)} × ${multiplier})</span></div>
            ${o.note ? `<div style="margin-top:8px; font-size:14px; color:var(--ink-soft); line-height:1.55;">${escapeHtml(o.note)}</div>` : ""}
            ${commentHtml}
            ${commentFormHtml}
            ${actionsHtml}
          </div>
        `;
      }).join("");

      listEl.querySelectorAll(".comment-submit").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.id;
          const input = listEl.querySelector(`.comment-input[data-id="${id}"]`);
          const content = input.value.trim();
          if (!content) return;
          btn.disabled = true;
          const { error: commentError } = await sb.from("supply_request_comments").insert({
            request_id: id, content, author_id: profileRef.id,
          });
          if (!commentError) {
            await sb.from("supply_requests").update({ status: "발주완료" }).eq("id", id);
          }
          btn.disabled = false;
          loadOrders();
        });
      });

      listEl.querySelectorAll(".pay-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!isVisor(profileRef)) return;
          const id = btn.dataset.id;
          const value = btn.dataset.value;
          const { error } = await sb.from("supply_requests").update({ payment_status: value }).eq("id", id);
          if (error) {
            alert("변경에 실패했습니다: " + error.message);
            return;
          }
          loadOrders();
        });
      });

      listEl.querySelectorAll("[data-action='edit']").forEach((btn) => {
        btn.addEventListener("click", () => {
          const o = allOrders.find((x) => x.id === btn.dataset.id);
          if (o) startEdit(o);
        });
      });
      listEl.querySelectorAll("[data-action='delete']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("이 발주 요청을 삭제할까요? 삭제하면 되돌릴 수 없습니다.")) return;
          const { error } = await sb.from("supply_requests").delete().eq("id", btn.dataset.id);
          if (error) {
            alert("삭제에 실패했습니다: " + error.message);
            return;
          }
          loadOrders();
        });
      });
    }

    async function loadOrders() {
      const { data, error } = await sb
        .from("supply_requests")
        .select("*, profiles(store_name), supply_request_comments(id, content, created_at)")
        .order("created_at", { ascending: false });
      if (error) {
        document.getElementById("orderList").innerHTML = `<div class="empty-state">불러오기 실패: ${escapeHtml(error.message)}</div>`;
        return;
      }
      allOrders = data || [];
      renderStatusTabs();
      renderOrders();
    }

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      profileRef = auth.profile;
      renderGnb("orders", profileRef);
      revealPage();

      populateItemSelect();
      refreshQtyField();
      await loadPriceMap();
      refreshEstimatedTotal();

      document.getElementById("f_item").addEventListener("change", refreshQtyField);
      document.getElementById("f_qty").addEventListener("change", refreshEstimatedTotal);

      if (isVisor(profileRef)) {
        document.getElementById("priceSettingBtn").classList.remove("hidden");
      }
      document.getElementById("priceSettingBtn").addEventListener("click", openPriceModal);
      document.getElementById("priceModalCloseBtn").addEventListener("click", closePriceModal);
      document.getElementById("priceModalBackdrop").addEventListener("click", (e) => {
        if (e.target.id === "priceModalBackdrop") closePriceModal();
      });
      document.getElementById("priceSaveBtn").addEventListener("click", async () => {
        const errEl = document.getElementById("priceModalError");
        clearFormError(errEl);
        const rows = Array.from(document.querySelectorAll(".price-input")).map((input) => ({
          item_name: input.dataset.name,
          unit_price: Number(input.value) || 0,
        }));
        const { error } = await sb.from("order_item_prices").upsert(rows, { onConflict: "item_name" });
        if (error) {
          showFormError(errEl, "저장에 실패했습니다: " + error.message);
          return;
        }
        await loadPriceMap();
        refreshEstimatedTotal();
        renderOrders();
        closePriceModal();
      });

      document.getElementById("writeBtn").addEventListener("click", () => {
        document.getElementById("writeForm").classList.remove("hidden");
      });
      document.getElementById("cancelBtn").addEventListener("click", () => {
        editingId = null;
        document.getElementById("f_item").selectedIndex = 0;
        refreshQtyField();
        document.getElementById("f_note").value = "";
        document.getElementById("submitBtn").textContent = "등록";
        document.getElementById("writeForm").classList.add("hidden");
      });
      document.getElementById("submitBtn").addEventListener("click", async () => {
        const errEl = document.getElementById("formError");
        clearFormError(errEl);
        const item_name = document.getElementById("f_item").value;
        const quantity = document.getElementById("f_qty").value;
        const note = document.getElementById("f_note").value.trim() || null;
        if (!item_name || !quantity) {
          showFormError(errEl, "물품과 수량/단위를 선택해주세요.");
          return;
        }
        const { error } = editingId
          ? await sb.from("supply_requests").update({ item_name, quantity, note }).eq("id", editingId)
          : await sb.from("supply_requests").insert({ item_name, quantity, note, owner_id: profileRef.id, status: "요청", payment_status: "미완료" });
        if (error) {
          showFormError(errEl, "저장에 실패했습니다: " + error.message);
          return;
        }
        editingId = null;
        document.getElementById("f_item").selectedIndex = 0;
        refreshQtyField();
        document.getElementById("f_note").value = "";
        document.getElementById("submitBtn").textContent = "등록";
        document.getElementById("writeForm").classList.add("hidden");
        loadOrders();
      });

      loadOrders();
    })();
  </script>
</body>
</html>
